<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>ClassClock</title>
<link rel="stylesheet" href="css/style.css">
<!-- Picks the layout (compact / mobile) before first paint. ?mode=compact|mobile forces one. -->
<script src="js/layout.js"></script>
</head>
<body data-phase="off" data-state="off">

  <!-- Compact layout: ~285x70 always-on-top window on the Mac (?mode=compact) -->
  <main id="compact" class="compact" aria-label="ClassClock コンパクト表示">
    <div class="c-row">
      <div class="c-clock" data-bind="clock">--:--</div>
      <div class="c-center">
        <div class="c-remain">
          <span class="c-num" data-bind="remain">--</span><span class="c-unit">分</span>
        </div>
        <div class="c-offclock" data-bind="clock">--:--</div>
      </div>
      <div class="c-info">
        <div class="c-title" data-bind="title">&nbsp;</div>
        <div class="c-sub" data-bind="sub">&nbsp;</div>
      </div>
    </div>
    <div class="bar"><i data-bind-progress></i></div>
  </main>

  <!-- Mobile layout: portrait phone.
       Top to bottom: date + clock / period + scheduled time / whole-day bar / progress ring / wake-lock button -->
  <main id="mobile" class="mobile" aria-label="ClassClock スマートフォン表示">
    <header class="m-top">
      <div class="m-date" data-bind="date">&nbsp;</div>
      <div class="m-time"><span class="m-clock" data-bind="clock">--:--</span><span class="m-sec" data-bind="sec">00</span></div>
    </header>

    <section class="m-period">
      <div class="m-periodline">
        <span class="m-title" data-bind="title">&nbsp;</span>
        <span class="m-range" data-bind="range">&nbsp;</span>
      </div>
      <!-- Whole school day: one segment per period, marker = now (built by app.js) -->
      <div class="m-day" id="day" role="img" aria-label="1日の授業の進み具合">
        <div class="tl"></div>
        <div class="tl-labels"></div>
      </div>
    </section>

    <section class="m-body">
      <!-- Progress ring: the coloured arc is the elapsed share of the class (or break); remaining minutes sit inside -->
      <div class="m-ring">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="88" />
          <circle class="ring-fill" cx="100" cy="100" r="88" pathLength="100" stroke-dasharray="0 100" data-bind-ring />
          <!-- gaps every 30 minutes, drawn by app.js -->
          <g id="ring-ticks"></g>
        </svg>
        <div class="m-ring-text">
          <div class="m-remain-label" data-bind="remainLabel">&nbsp;</div>
          <div class="m-remain"><span class="m-num" data-bind="remain">--</span><span class="m-unit">分</span></div>
          <div class="m-elapsed" data-bind="elapsed">&nbsp;</div>
        </div>
      </div>
    </section>

    <section class="m-foot">
      <button id="wake-btn" class="wake" type="button" aria-pressed="false">画面を点灯したままにする</button>
      <p id="wake-msg" class="wake-msg" role="status"></p>
    </section>
  </main>

  <noscript><p style="padding:16px;color:#ccc">ClassClock の表示には JavaScript が必要です。</p></noscript>

<script src="js/schedule.js"></script>
<script src="js/app.js"></script>
</body>
</html>
